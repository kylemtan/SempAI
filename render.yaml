services:
  - type: web
    name: sempai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: KROGER_CLIENT_ID
        sync: false
      - key: KROGER_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FULL_ACCESS_CODE
        sync: false
      - key: COOKIE_SIGNING_SECRET
        sync: false
