<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SempAI — Smart meal planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #FAFAF7; }
      html[data-theme='dark'] { background: #111110; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sempai-theme');
          if (stored) {
            var theme = JSON.parse(stored)?.state?.theme;
            if (theme) document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
        document.documentElement.classList.add('no-transition');
        window.addEventListener('load', function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.classList.remove('no-transition');
            });
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
